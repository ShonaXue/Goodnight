<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="这一整片夜色，都是我想给你的拥抱"><meta property="og:title" content="写在二十一晚之前 · 给小杜的晚安"><meta property="og:description" content="这一整片夜色，都是我想给你的拥抱"><title>写在二十一晚之前 · 给小杜的晚安</title><link rel="icon" href="../../favicon.svg"><link rel="stylesheet" href="../../styles.css"></head><body><main class="player-shell has-card-bg" style="--player-image:url('../../og.png')"><div class="player-scrim" aria-hidden="true"></div><header class="player-topbar"><a class="back-home" href="../../">← 返回全部卡片</a><span>晚安语音 · 01 / 21</span></header><section class="player-layout"><article class="player-content"><p class="player-theme">写给你的话</p><h1>写在二十一晚之前</h1><p class="player-sub">这一整片夜色，都是我想给你的拥抱</p><div class="player-audio-block"><span>☾</span><div><strong>今晚的语音</strong><small>戴上耳机，调低音量，慢慢听</small></div><div class="custom-player page-custom-player"><audio preload="metadata" src="../../audio/01-to-my-love.m4a"></audio><div class="player-controls"><button type="button" data-action="toggle" aria-label="播放《写在二十一晚之前》">▶</button><button type="button" data-action="skip" aria-label="回退5秒">−5秒</button><button type="button" data-action="rate" aria-label="切换播放速度">1×</button></div><input type="range" min="0" max="0" step="0.1" value="0" aria-label="《写在二十一晚之前》播放进度"></div></div><details class="message-block" open><summary>今晚想说的话</summary><p class="player-script">亲爱的，这是我送给你的二十一句晚安。也许我不能每一晚都刚好在你身边，但我想把声音留在这里。开心的时候听，疲惫的时候也听。你只要记得，无论今天发生了什么，总有一个人认真地爱着你。晚安，我最喜欢的人。</p></details></article></section><nav class="player-nav player-nav-panel"><a href="../wake-up-loved/"><small>上一张</small><br>← 睡吧睡吧，我亲爱的小猪</a><a href="../../">全部 21 张</a><a href="../you-did-enough/"><small>下一张</small><br>今天是不是有点累了 →</a></nav></main><script>document.querySelectorAll('.custom-player').forEach(player=>{const audio=player.querySelector('audio');const toggle=player.querySelector('[data-action="toggle"]');const skip=player.querySelector('[data-action="skip"]');const rate=player.querySelector('[data-action="rate"]');const range=player.querySelector('input[type="range"]');const rates=[1,1.25,1.5,2];toggle.addEventListener('click',async()=>{if(audio.paused){await audio.play()}else{audio.pause()}});audio.addEventListener('play',()=>{toggle.textContent='Ⅱ';toggle.setAttribute('aria-label','暂停')});audio.addEventListener('pause',()=>{toggle.textContent='▶';toggle.setAttribute('aria-label','播放')});audio.addEventListener('loadedmetadata',()=>{range.max=audio.duration||0});audio.addEventListener('timeupdate',()=>{range.value=audio.currentTime});range.addEventListener('input',()=>{audio.currentTime=Number(range.value)});skip.addEventListener('click',()=>{audio.currentTime=Math.max(0,audio.currentTime-5)});rate.addEventListener('click',()=>{const current=rates.indexOf(audio.playbackRate);const next=rates[(current+1)%rates.length];audio.playbackRate=next;rate.textContent=next+'×'})});</script></body></html>
