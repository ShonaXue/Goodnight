<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="过来抱一下，今天也让你好好靠一会儿"><meta property="og:title" content="快过来抱抱抱抱 · 给小杜的晚安"><meta property="og:description" content="过来抱一下，今天也让你好好靠一会儿"><title>快过来抱抱抱抱 · 给小杜的晚安</title><link rel="icon" href="../../favicon.svg"><link rel="stylesheet" href="../../styles.css"></head><body><main class="player-shell has-card-bg" style="--player-image:url('../../card-backgrounds/card-09.png')"><div class="player-scrim" aria-hidden="true"></div><header class="player-topbar"><a class="back-home" href="../../">← 返回全部卡片</a><span>晚安语音 · 09 / 21</span></header><section class="player-layout"><article class="player-content"><p class="player-theme">今天非常想我吗？</p><h1>快过来抱抱抱抱</h1><p class="player-sub">过来抱一下，今天也让你好好靠一会儿</p><div class="player-audio-block"><span>☾</span><div><strong>今晚的语音</strong><small>戴上耳机，调低音量，慢慢听</small></div><div class="custom-player page-custom-player"><audio preload="metadata" src="../../audio/09-missing-you-softly.m4a"></audio><div class="player-controls"><button type="button" data-action="toggle" aria-label="播放《快过来抱抱抱抱》">▶</button><button type="button" data-action="skip" aria-label="回退5秒">−5秒</button><button type="button" data-action="rate" aria-label="切换播放速度">1×</button></div><input type="range" min="0" max="0" step="0.1" value="0" aria-label="《快过来抱抱抱抱》播放进度"></div></div><details class="message-block" open><summary>今晚想说的话</summary><p class="player-script">小杜，快过来。 抱——抱——抱——抱。 今天先给你一个超级大的抱抱。 如果你累了，就靠一会儿。 如果你开心，也可以抱一会儿。 如果你什么事情都没有，只是单纯想抱我，那更可以抱一会儿。 现在想象一下，我整个人缩进你怀里，手抱着你，然后脑袋蹭一蹭。 好啦。 不许动。 这个抱抱至少持续十秒钟。 睡觉之前再偷偷抱紧一点。 今日份拥抱派送成功。</p></details></article></section><nav class="player-nav player-nav-panel"><a href="../moon-sent-my-kiss/"><small>上一张</small><br>← 不想我的时候点开这一张</a><a href="../../">全部 21 张</a><a href="../same-night-sky/"><small>下一张</small><br>假装就在你身边 →</a></nav></main><script>document.querySelectorAll('.custom-player').forEach(player=>{const audio=player.querySelector('audio');const toggle=player.querySelector('[data-action="toggle"]');const skip=player.querySelector('[data-action="skip"]');const rate=player.querySelector('[data-action="rate"]');const range=player.querySelector('input[type="range"]');const rates=[1,1.25,1.5,2];toggle.addEventListener('click',async()=>{if(audio.paused){await audio.play()}else{audio.pause()}});audio.addEventListener('play',()=>{toggle.textContent='Ⅱ';toggle.setAttribute('aria-label','暂停')});audio.addEventListener('pause',()=>{toggle.textContent='▶';toggle.setAttribute('aria-label','播放')});audio.addEventListener('loadedmetadata',()=>{range.max=audio.duration||0});audio.addEventListener('timeupdate',()=>{range.value=audio.currentTime});range.addEventListener('input',()=>{audio.currentTime=Number(range.value)});skip.addEventListener('click',()=>{audio.currentTime=Math.max(0,audio.currentTime-5)});rate.addEventListener('click',()=>{const current=rates.indexOf(audio.playbackRate);const next=rates[(current+1)%rates.length];audio.playbackRate=next;rate.textContent=next+'×'})});</script></body></html>
