>{const audio=player.querySelector('audio');const toggle=player.querySelector('[data-action="toggle"]');const skip=player.querySelector('[data-action="skip"]');const rate=player.querySelector('[data-action="rate"]');const range=player.querySelector('input[type="range"]');const rates=[1,1.25,1.5,2];toggle.addEventListener('click',async()=>{if(audio.paused){await audio.play()}else{audio.pause()}});audio.addEventListener('play',()=>{toggle.textContent='Ⅱ';toggle.setAttribute('aria-label','暂停')});audio.addEventListener('pause',()=>{toggle.textContent='▶';toggle.setAttribute('aria-label','播放')});audio.addEventListener('loadedmetadata',()=>{range.max=audio.duration||0});audio.addEventListener('timeupdate',()=>{range.value=audio.currentTime});range.addEventListener('input',()=>{audio.currentTime=Number(range.value)});skip.addEventListener('click',()=>{audio.currentTime=Math.max(0,audio.currentTime-5)});rate.addEventListener('click',()=>{const current=rates.indexOf(audio.playbackRate);const next=rates[(current+1)%rates.length];audio.playbackRate=next;rate.textContent=next+'×'})});</script></body></html>
